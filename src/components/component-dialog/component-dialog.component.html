<div class="card flex justify-content-center" (focus)="(true)">
  <p-dialog
    [modal]="true"
    [(visible)]="visible"
    
    [dismissableMask]="true"
    [closeOnEscape]="true"
  >
    <ng-template #headless>
      <div class="mainbody">
        <ng-content class="content"></ng-content>
        <div class="flexbody">
          <p>{{ description }}</p>
        </div>
      </div>
    </ng-template>
  </p-dialog>
</div>
